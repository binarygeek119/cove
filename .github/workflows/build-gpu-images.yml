name: Build GPU images from upstream Cove releases

on:
  schedule:
    # Check upstream Cove once a day for a new stable release.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: yourcove/cove

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve latest stable upstream release
        id: resolve
        run: |
          set -euo pipefail
          json=$(curl -fsSL "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest")
          tag=$(echo "$json" | jq -r '.tag_name')
          prerelease=$(echo "$json" | jq -r '.prerelease')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "No upstream release found" >&2
            exit 1
          fi
          if [ "$prerelease" != "false" ]; then
            echo "Latest upstream release $tag is a prerelease; skipping" >&2
            exit 1
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream stable release: $tag"

  build:
    needs: resolve-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gpu: [intel, amd, nvidia]
    steps:
      - name: Checkout upstream source at stable tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve-version.outputs.tag }}
          path: upstream

      - name: Checkout this fork (for GPU Dockerfiles)
        uses: actions/checkout@v4
        with:
          path: self

      - name: Overlay GPU Dockerfiles onto upstream source
        run: cp self/docker/Dockerfile.app.* upstream/docker/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this version is already published
        id: check
        run: |
          image="${{ env.REGISTRY }}/${{ github.repository_owner }}/cove-app-${{ matrix.gpu }}"
          version="${{ needs.resolve-version.outputs.version }}"
          if docker manifest inspect "${image}:${version}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Image ${image}:${version} already exists; skipping build"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: docker/Dockerfile.app.${{ matrix.gpu }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/cove-app-${{ matrix.gpu }}:${{ needs.resolve-version.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/cove-app-${{ matrix.gpu }}:latest
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.resolve-version.outputs.version }}
